name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 11:00 PM IST daily (IST = UTC+5:30)
    - cron: '30 17 * * *'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      MOBILE_NUMBER: ${{ secrets.MOBILE_NUMBER }}
      PIN: ${{ secrets.PIN }}
      ORG_NAME: ${{ secrets.ORG_NAME }}
      LOCATION_NAME: ${{ secrets.LOCATION_NAME }}
      TERMINAL_NAME: ${{ secrets.TERMINAL_NAME }}
      RESTAURANT_ORG_NAME: ${{ secrets.RESTAURANT_ORG_NAME }}
      DINEIN_LOCATION_NAME: ${{ secrets.DINEIN_LOCATION_NAME }}
      QSR_LOCATION_NAME: ${{ secrets.QSR_LOCATION_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check JavaScript syntax and imports
        run: npm run check

      - name: Check shared session lifecycle offline
        run: npm run test:framework

      - name: Run Playwright tests
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
